//home.html
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Homepage</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<!-- tailwind and daisi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- google font outfit -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome cdn (icons) -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
    *{
        font-family: "Outfit", sans-serif;
    }
</style>

</head>
<script src="/machine.js"></script>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-1">
                <div class="logo w-[60px]">
                <img src="assets/logo.png" alt="">
            </div>
            <div class="balance-info">
                <h2 class="text-2xl font-bold">$<span id="balance">30000</span></h2>
                <p class="text-neutral/50 ">Available balance</p>
            </div>
            </div>
            <div class="right">
                <a href="index.html"><button class="btn btn-primary"><i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</button></a>
            </div>
        </section>
    </header>

    <section class="w-11/12 mx-auto py-8 space-y-5">
        <h2 class="text-2xl">Welcome to pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

        <div onclick="makeblue()" class="buttons grid grid-cols-3 gap-3">
            <button onclick="showOnly('cashin')" class=" btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showOnly('cashout')" class="btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-2.png" alt="">
                <p>CashOut</p>
            </button>
            <button onclick="showOnly('transfer')" class="btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button class="btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button class="btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button class="btn flex-col h-full py-4 btn-soft btn-primary">
                <img src="assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>

    <!-- Add money -->
     <section id="cashin" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Add Money</h2>
        

                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-xl mx-auto">
      <div class="card-body rounded-2xl">
        <fieldset class="fieldset">
            <label class="label font-bold text-neutral">Select A Bank</label>
<select class="select rounded-full bg-base-200 w-full">
          <option value="" disabled selected class="text-neutral/50">
            Select Bank
          </option>
          <option value="dbbl">Dutch-Bangla Bank</option>
          <option value="brac">BRAC Bank</option>
          <option value="islamic">Islami Bank</option>
          <option value="sonali">Sonali Bank</option>
        </select>
        <br>

          <label  class="label font-bold text-neutral">Bank Account Number</label>
          
          <input id="bank-num" maxlength="11" type="text"  class="input rounded-full bg-base-200 w-full" value="" placeholder="Enter your 11 digit number" />
          <br>
          <label  class="label font-bold text-neutral">Add to Amount</label>
          <input id="add-amount" type="number" class="input rounded-full bg-base-200 w-full"  placeholder="Add amount to withdraw" />
          <br>
          <label  class="label  font-bold text-neutral">Pin Number</label>
          <input id="cashin-pin" maxlength="4" password class="input rounded-full bg-base-200 w-full"  placeholder="Enter 4 Digit Pin" type="password"/>
          
          <button id="cashIn-btn" class="btn btn-primary mt-4 rounded-full cursor-pointer">Add Money</button>
        </fieldset>
      </div>
    </div>

    </section>
    <script src="cashin.js"></script>

    <!-- cashout section -->
    <section id="cashout" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Cash Out</h2>
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-xl mx-auto">
      <div class="card-body rounded-2xl">
        <fieldset class="fieldset">
          <label  class="label font-bold text-neutral">Agent Number</label>
          <input id="cashout-num" maxlength="11" type="text" class="input rounded-full bg-base-200 w-full" value="" placeholder="Enter your 11 digit number" />
          <br>
          <label  class="label font-bold text-neutral">Amount</label>
          <input id="withdraw-amount" type="number" class="input rounded-full bg-base-200 w-full"  placeholder="Enter amount to withdraw" />
          <br>
          <label  class="label  font-bold text-neutral">4 Digit Pin</label>
          <input id="cashout-pin" maxlength="4" password class="input rounded-full bg-base-200 w-full"  placeholder="Enter 4 Digit Pin" type="password"/>
          
          <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full cursor-pointer">Withdraw Money</button>
        </fieldset>
      </div>
    </div>

    </section>
    <script src="cashout.js"></script>

    <!-- Transfer Money section -->
     <section id="transfer" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-2xl font-bold mb-5">Transfer Money</h2>
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-xl mx-auto">
      <div class="card-body rounded-2xl">
        <fieldset class="fieldset">
          <label  class="label font-bold text-neutral">User Account Number</label>
          <input id="account-num" maxlength="11" type="text" class="input rounded-full bg-base-200 w-full" value="" placeholder="Enter your 11 digit number" />
          <br>
          <label  class="label font-bold text-neutral">Amount</label>
          <input id="transfer-amount" type="number" class="input rounded-full bg-base-200 w-full"  placeholder="Enter amount to Tranfer" />
          <br>
          <label  class="label  font-bold text-neutral">Pin</label>
          <input id="transfer-pin" maxlength="4" password class="input rounded-full bg-base-200 w-full"  placeholder="Enter 4 Digit Pin" type="password"/>
          
          <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full cursor-pointer">Send Now</button>
        </fieldset>
      </div>
    </div>
    <script src="transfer.js"></script>
    </section>
   

<!-- history section -->
 <section id="history" class="w-11/12 mx-auto py-5 space-y-5">
     <h2 class="text-2xl font-bold mb-5">Tranjections</h2>
                <div class="" id="history-conteiner">
      <div id="tranjection-card p-5 bg-base-100">           


      </div>
    </div>
 </section>
</body>
</html>
