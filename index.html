<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo login</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<!-- tailwind and daisi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- google font outfit -->
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome cdn (icons) -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
    *{
        font-family: "Outfit", sans-serif;
    }
</style>

</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[200px] mx-auto pt-32">
        <img src="assets/Logo-full.png" alt="">
    </div>
    
    <div class="form pt-10 ">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-xl mx-auto">
      <div class="card-body rounded-2xl">
        <fieldset class="fieldset">
          <label for="input-number" class="label font-bold text-neutral">Mobile Number</label>
          <input id="input-number" maxlength="11" type="text" class="input rounded-full bg-base-200" value="01319206309" placeholder="Enter your 11 digit number" />
          <br>
          <label for="input-pin" class="label  font-bold text-neutral">4 Digit Pin</label>
          <input id="input-pin" maxlength="4" password class="input rounded-full bg-base-200 "  placeholder="Enter 4 Digit Pin" />
          
          <button id="login-btn" class="btn btn-primary mt-4 rounded-full cursor-pointer">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
</div>
    </div>
     <script src="login.js"></script>
</body>
</html>
